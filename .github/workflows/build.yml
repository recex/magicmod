name: Build Mod

on:
  push:
    branches: [ "main", "master", "arena/**" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'

      - name: Build with Gradle
        id: gradle_build
        shell: bash
        run: |
          set -o pipefail
          gradle build --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Build report
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CHECK_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 .github/scripts/ci_report.py build.log "${{ steps.gradle_build.outcome }}"

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: magicmod-jar
          path: build/libs/*.jar
          if-no-files-found: error
