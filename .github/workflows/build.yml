name: Build Mod

on:
  push:
    branches: [ "main", "master", "arena/**" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'

      - name: Build with Gradle
        id: gradle_build
        shell: bash
        run: |
          set -o pipefail
          gradle build --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Build report
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CHECK_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 .github/scripts/ci_report.py build.log "${{ steps.gradle_build.outcome }}"

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: magicmod-jar
          path: build/libs/*.jar
          if-no-files-found: error

  # Sobe o cliente de verdade numa tela virtual (Xvfb) com OpenGL por software
  # (Mesa llvmpipe) e roda o autoteste grafico do mod: compila os shaders,
  # monta os framebuffers, dispara os efeitos num mundo de teste e captura quadros.
  selftest:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'

      - name: Install Xvfb and Mesa
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb libgl1-mesa-dri libglx-mesa0 libopenal1 mesa-utils
          python3 -m pip install --quiet --disable-pip-version-check pillow || true

      - name: Run client self-test
        id: client_selftest
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
          ALSOFT_DRIVERS: "null"
        run: |
          set -o pipefail
          mkdir -p run
          cp .github/selftest/options.txt run/options.txt
          xvfb-run -a -s "-screen 0 1280x720x24" glxinfo -B > glxinfo.txt 2>&1 || true
          timeout 1500 xvfb-run -a -s "-screen 0 1280x720x24" \
            gradle runClient --no-daemon -PmagicmodSelfTest=full 2>&1 | tee selftest.log

      - name: Self-test report
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CHECK_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 .github/scripts/ci_selftest_report.py run/selftest selftest.log

